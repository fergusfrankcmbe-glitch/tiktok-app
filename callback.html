<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Callback</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto;
         padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  code { display: block; background: #f4f4f5; padding: 1rem; border-radius: 6px;
         word-break: break-all; font-size: 0.9rem; margin: 1rem 0; }
  button { font: inherit; padding: 0.5rem 1rem; border-radius: 6px;
           border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .warn { color: #a33; }
</style>
</head>
<body>
  <h1>Authorization callback</h1>
  <div id="out">Reading…</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const err  = params.get("error");
  const out  = document.getElementById("out");

  if (code) {
    out.innerHTML =
      "<p>Authorization code:</p>" +
      "<code id='codebox'></code>" +
      "<button id='copybtn'>Copy</button>" +
      "<p class='warn'>This code expires within minutes. Exchange it now.</p>";
    document.getElementById("codebox").textContent = code;
    document.getElementById("copybtn").onclick = function () {
      navigator.clipboard.writeText(code);
      this.textContent = "Copied";
    };
  } else if (err) {
    out.innerHTML = "<p class='warn'>Authorization failed: " +
      err.replace(/[<>&]/g, "") + "</p>";
  } else {
    out.innerHTML = "<p>No authorization code in this URL. " +
      "Start the sign-in flow to land here with one.</p>";
  }
</script>
</body>
</html>
